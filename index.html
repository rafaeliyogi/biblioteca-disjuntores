<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca de Disjuntores</title>
<style>
:root{--ink:#14202b;--bg:#dfe6ea;--wood:#4a2f1e;--wood2:#6b4630;--brass:#c89b3c;--red:#b3261e;--panel:#f5f7f8;--line:#b9c4cb;--oil:#2f7db8}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--ink);color:#fff;padding:14px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{font:700 1.25rem Georgia,serif;margin:0;flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--ink);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:4px}
button:hover{background:var(--brass)}button:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
button.on{background:var(--ink);color:#fff}
header button{border-color:#fff;background:transparent;color:#fff}header button:hover{color:var(--ink)}
main{max-width:1000px;margin:0 auto;padding:20px}
h2{font:700 1.5rem Georgia,serif;margin:.2em 0 .6em}
.shelf{background:var(--wood);border-radius:6px;padding:14px 14px 0;margin-bottom:22px}
.books{display:flex;gap:10px;align-items:flex-end;min-height:150px}
.board{height:14px;background:var(--wood2);margin:0 -14px;border-top:3px solid #2e1c10}
.book{width:74px;height:150px;border-radius:3px 3px 0 0;color:#fff;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font:700 1.05rem Georgia,serif;border:2px solid rgba(255,255,255,.35);border-bottom:0}
.book.off{opacity:.4;cursor:default;height:130px}
.cap{color:#f3e3c0;font:600 .95rem system-ui;margin:0 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:start}
@media(max-width:760px){.grid{grid-template-columns:1fr}.book{width:62px}}
.fig{position:relative;display:block;margin:0 auto;width:100%;max-width:var(--mw,560px);line-height:0}
.fig img{width:100%;height:auto;display:block;border-radius:4px;background:#fff;transition:transform .5s,opacity .5s}
.fig.go img{transform:scale(1.15);opacity:0}
.pt{position:absolute;transform:translate(-50%,-50%);min-width:22px;height:22px;border-radius:11px;padding:0 4px;background:rgba(200,155,60,.88);border:2px solid var(--ink);font:700 10px/1 system-ui;color:var(--ink);display:flex;align-items:center;justify-content:center}
.pt:hover,.pt.sel{background:var(--red);color:#fff;z-index:2;transform:translate(-50%,-50%) scale(1.25)}
.pt.oil{background:rgba(47,125,184,.9);color:#fff}
.pt.hl{outline:3px solid var(--red);outline-offset:2px}
.pt.hint{width:34px;height:34px;border-radius:50%;animation:p 1.4s infinite;font-size:16px}
@keyframes p{50%{box-shadow:0 0 0 12px rgba(200,155,60,0)}0%{box-shadow:0 0 0 0 rgba(200,155,60,.9)}}
.tag{display:inline-block;background:var(--ink);color:#fff;border-radius:3px;padding:1px 8px;font-size:.85rem}
dl{margin:.4em 0}dt{font-weight:700;margin-top:.7em}dd{margin:0}
.warn{border-left:5px solid var(--red);background:#fbe9e7;padding:8px 12px;margin-top:12px;font-size:.92rem}
.lub{border-left:5px solid var(--brass);background:#fbf3de;padding:8px 12px;margin-top:8px}
.hide{display:none}.note{font-size:.85rem;color:#44525d;margin:.6em 0 0}
.chips button{font-size:.85rem;padding:4px 10px}

.zb{position:absolute;right:8px;top:8px;line-height:1.2;font-size:.8rem;padding:4px 8px;background:rgba(245,247,248,.92);z-index:3}
.lb{position:fixed;inset:0;background:rgba(10,18,25,.96);z-index:50;display:flex;flex-direction:column;--z:1}
.lbt{display:flex;gap:8px;align-items:center;padding:8px 12px;flex-wrap:wrap;color:#fff;font-size:.85rem}
.lbv{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab}
.lbc{position:absolute;left:0;top:0;transform-origin:0 0}
.lb .pt{transform:translate(-50%,-50%) scale(calc(1 / var(--z)))}
.lb .fig img{transition:none}
ol{padding-left:1.2em;margin:.3em 0}

.zp{right:auto;left:8px}
.nopts .pt:not(.hint){display:none}
.tb{border-collapse:collapse;width:100%;font-size:.88rem}
.tb th,.tb td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
.tb th{font-weight:600}.tb .gr th{background:#e3eaee;font-size:.82rem;text-transform:uppercase;letter-spacing:.03em}
.tbw{overflow-x:auto}.ok{color:#1b6b3a;font-weight:700}.bad{color:var(--red);font-weight:700}
@media(prefers-reduced-motion:reduce){.fig img{transition:none}.pt.hint{animation:none}}
</style>
</head>
