<style>
:root{--ink:#14202b;--bg:#dfe6ea;--wood:#4a2f1e;--wood2:#6b4630;--brass:#c89b3c;--red:#b3261e;--panel:#f5f7f8;--line:#b9c4cb;--oil:#2f7db8}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--ink);color:#fff;padding:14px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{font:700 1.25rem Georgia,serif;margin:0;flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--ink);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:4px}
button:hover{background:var(--brass)}button:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
button.on{background:var(--ink);color:#fff}
header button{border-color:#fff;background:transparent;color:#fff}header button:hover{color:var(--ink)}
main{max-width:1000px;margin:0 auto;padding:20px}
h2{font:700 1.5rem Georgia,serif;margin:.2em 0 .6em}
.shelf{background:var(--wood);border-radius:6px;padding:14px 14px 0;margin-bottom:22px}
.books{display:flex;gap:10px;align-items:flex-end;min-height:150px}
.board{height:14px;background:var(--wood2);margin:0 -14px;border-top:3px solid #2e1c10}
.book{width:74px;height:150px;border-radius:3px 3px 0 0;color:#fff;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font:700 1.05rem Georgia,serif;border:2px solid rgba(255,255,255,.35);border-bottom:0}
.book.off{opacity:.4;cursor:default;height:130px}
.cap{color:#f3e3c0;font:600 .95rem system-ui;margin:0 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:start}
@media(max-width:760px){.grid{grid-template-columns:1fr}.book{width:62px}}
.fig{position:relative;display:block;margin:0 auto;width:100%;max-width:var(--mw,560px);line-height:0}
.fig img{width:100%;height:auto;display:block;border-radius:4px;background:#fff;transition:transform .5s,opacity .5s}
.fig.go img{transform:scale(1.15);opacity:0}
.pt{position:absolute;transform:translate(-50%,-50%);min-width:22px;height:22px;border-radius:11px;padding:0 4px;background:rgba(200,155,60,.88);border:2px solid var(--ink);font:700 10px/1 system-ui;color:var(--ink);display:flex;align-items:center;justify-content:center}
.pt:hover,.pt.sel{background:var(--red);color:#fff;z-index:2;transform:translate(-50%,-50%) scale(1.25)}
.pt.oil{background:rgba(47,125,184,.9);color:#fff}
.pt.hl{outline:3px solid var(--red);outline-offset:2px}
.pt.hint{width:34px;height:34px;border-radius:50%;animation:p 1.4s infinite;font-size:16px}
@keyframes p{50%{box-shadow:0 0 0 12px rgba(200,155,60,0)}0%{box-shadow:0 0 0 0 rgba(200,155,60,.9)}}
.tag{display:inline-block;background:var(--ink);color:#fff;border-radius:3px;padding:1px 8px;font-size:.85rem}
dl{margin:.4em 0}dt{font-weight:700;margin-top:.7em}dd{margin:0}
.warn{border-left:5px solid var(--red);background:#fbe9e7;padding:8px 12px;margin-top:12px;font-size:.92rem}
.lub{border-left:5px solid var(--brass);background:#fbf3de;padding:8px 12px;margin-top:8px}
.hide{display:none}.note{font-size:.85rem;color:#44525d;margin:.6em 0 0}
.chips button{font-size:.85rem;padding:4px 10px}
@media(prefers-reduced-motion:reduce){.fig img{transition:none}.pt.hint{animation:none}}
</style>
</head>

["chd","Chave LIG/DESL do disjuntor","Comando elétrico local de fechamento e abertura, no painel de controle.","Manual Fig. 10 (item 3), seções 3.1 e 7.5. Peça 4394570001 (S14).","",[["fmec",80.7,69.2,"E"]]],
["viz","Visor de indicações mecânicas","Janela de plexiglass na porta para ver LIG/DESL, mola carregada e contador sem abrir a porta.","Manual Fig. 10 (item 13) e Fig. 1 (item J).","",[["fmec",27.2,64.4,"V"]]],
["man","Manivela de carga da mola","Alavanca manual para carregar a mola de fechamento. Fica guardada na porta da carcaça.","Manual seções 7.3 e 8.13 (item 5). Peça 3AX1530-3B.","Mantenha sempre na carcaça do mecanismo.",[["fmec",20.2,44.4,"M"]]]
];
{const D=DISJ["3AF01"];
 EX.forEach(e=>D.comp.find(c=>c.id===e[0]).hs.push([e[1],e[2],e[3],e[4]]));
 NEW.forEach(r=>{const o={id:r[0],n:r[1],f:r[2],proj:r[3],tec:r[4]||"",hs:r[5]||[],g:r[6]};if(r[7]){o.lub=r[7].replace("GRX",GR).replace("OLX",OL);o.ll=r[8]}D.comp.push(o)});
 NEW.filter(r=>r[0]==="cx").forEach(()=>{});
}

/* ============ NAVEGAÇÃO ============ */
const app=document.getElementById("app"),back=document.getElementById("back");
let stack=[];
function go(fn){stack.push(fn);fn();back.classList.toggle("hide",stack.length<2)}
back.onclick=()=>{stack.pop();stack[stack.length-1]();back.classList.toggle("hide",stack.length<2)};
const $=s=>document.querySelector(s);

function shelf(){
 app.innerHTML='<h2>Escolha a classe de tensão</h2><p>Cada prateleira é uma classe. Livros apagados ainda não têm modelos cadastrados.</p>'+
 CLASSES.map(c=>`<div class="shelf"><p class="cap">${c.kv}</p><div class="books">${
  c.itens.length?c.itens.map(i=>`<button class="book" style="background:${c.cor}" data-m="${i}">${DISJ[i].marca} ${i}</button>`).join(""):`<div class="book off" style="background:${c.cor}" aria-hidden="true">vazio</div>`
 }</div><div class="board"></div></div>`).join("");
 app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>go(()=>ficha(b.dataset.m)));
}

function ficha(id){
 const d=DISJ[id],[mx,my]=d.maçaneta;
 app.innerHTML=`<h2>${d.marca} ${d.modelo}</h2><div class="grid"><div class="card"><div class="fig" id="fig" style="--mw:300px"><img src="${d.base}externa.jpg" alt="Foto do disjuntor ${id}">
 <button class="pt hint" id="handle" style="left:${mx}%;top:${my}%" aria-label="Abrir a porta do mecanismo">⌂</button></div><p class="note" style="text-align:center">Foto: catálogo Siemens. Clique na maçaneta (ponto dourado).</p></div>
 <div><div class="card"><p><span class="tag">${d.classe}</span></p><p>${d.resumo}</p>
 <div class="row"><a href="${d.docs.projeto}" target="_blank"><button>Projeto</button></a><a href="${d.docs.manual}" target="_blank"><button>Manual</button></a><a href="${d.docs.catalogo}" target="_blank"><button>Catálogo</button></a><button id="pl">Placa</button></div>
 <div id="placa" class="hide"></div></div></div></div>`;
 $("#pl").onclick=()=>{const p=$("#placa");p.classList.toggle("hide");p.innerHTML=`<dl>${d.placa.map(x=>`<dt>${x}</dt>`).join("")}</dl><p class="note">${d.placaNota}</p>`};
 $("#handle").onclick=()=>{$("#fig").classList.add("go");setTimeout(()=>go(()=>interno(id)),520)};
}

let cur={fig:"fmec",sel:null};
function interno(id,fig,hl){
 const d=DISJ[id];cur.fig=fig||cur.fig||"mec";
 app.innerHTML=`<h2>Por dentro do ${id}</h2><div class="row" style="margin:0 0 14px" id="tabs">${Object.entries(d.figs).map(([k,v])=>`<button data-f="${k}" class="${k===cur.fig?'on':''}">${v.t}</button>`).join("")}</div>
 <div class="grid"><div class="card"><div class="fig" style="--mw:${d.figs[cur.fig].mw}"><img src="${d.base}${d.figs[cur.fig].img}" alt="${d.figs[cur.fig].t}">${pontos(d,cur.fig,hl)}</div>
 <p class="note">Imagens do manual 3AF 01 e do catálogo Siemens. Números e letras minúsculas são os do manual; letras maiúsculas (L, C, D, E, V, M) são itens que identifiquei na foto.</p></div>
 <div class="card" id="info" aria-live="polite">${cur.fig==="lub"?`<p>Clique em uma letra para ver o ponto de lubrificação.</p><p><span class="tag" style="background:var(--brass);color:var(--ink)">△ ${GR.replace(" (△)","")}</span><br><span class="tag" style="background:var(--oil)">□ ${OL.replace(" (□)","")}</span></p><p class="note">Lubrificar a cada 4.000 operações (mais cedo em local com muita poeira). Manual, seção 8.4.</p>`:"<p>Clique em um ponto numerado (ou em um item da lista abaixo) para ver o que é, para que serve e onde achar no projeto.</p>"}</div></div>
 ${cur.fig==="lub"?"":`<div class="card chips"><b>Componentes desta figura</b><div class="row">${d.comp.filter(c=>!c.hs.length||c.hs.some(h=>h[0]===cur.fig)).map(c=>`<button data-c="${c.id}">${c.n}</button>`).join("")}</div></div>`}`;
 $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>interno(id,b.dataset.f));
 app.querySelectorAll("[data-c]").forEach(el=>el.onclick=()=>detalhe(d,el.dataset.c,id));
 app.querySelectorAll("[data-l]").forEach(el=>el.onclick=()=>lubPonto(d,+el.dataset.l,el));
 if(cur.fig!=="lub"&&cur.sel)detalhe(d,cur.sel,id,true);
}

function pontos(d,fig,hl){
 if(fig==="lub")return d.lubr.map((p,i)=>`<button class="pt ${p[2]==="o"?"oil":""} ${hl&&hl.includes(p[0])?"hl":""}" data-l="${i}" style="left:${p[3]}%;top:${p[4]}%" aria-label="Ponto ${p[0]}: ${p[1]}">${p[0]}</button>`).join("");
 return d.comp.flatMap(c=>c.hs.filter(h=>h[0]===fig).map(h=>`<button class="pt ${cur.sel===c.id?"sel":""}" data-c="${c.id}" style="left:${h[1]}%;top:${h[2]}%" aria-label="${c.n}">${h[3]}</button>`)).join("");
}

function lubPonto(d,i,el){
 const p=d.lubr[i],o=p[2]==="o";
 app.querySelectorAll(".pt").forEach(x=>x.classList.remove("sel"));el.classList.add("sel");
 $("#info").innerHTML=`<h2 style="font-size:1.2rem">Ponto ${p[0]}: ${p[1]}</h2><div class="lub" style="border-color:${o?"var(--oil)":"var(--brass)"}"><b>${o?"□ Óleo":"△ Graxa"}</b><br>${o?"Shell Tellus 32 (rolamentos inacessíveis à graxa e rolamentos da chave auxiliar S1)":"Isoflex Topas L 32 (rolamentos e superfícies deslizantes)"}</div>${aviso()}`;
}
const aviso=()=>`<div class="warn">Antes de lubrificar: abrir, isolar e aterrar o disjuntor, desligar a alimentação auxiliar e descarregar as molas (Manual 8.1 e 8.3). Mova levemente as juntas nos dois sentidos para o lubrificante entrar e opere o disjuntor algumas vezes depois.</div>`;

function detalhe(d,cid,id,keep){
 const c=d.comp.find(x=>x.id===cid);cur.sel=cid;
 if(!keep){app.querySelectorAll(".pt").forEach(x=>x.classList.toggle("sel",x.dataset.c===cid))}
 $("#info").innerHTML=`<h2 style="font-size:1.2rem">${c.n}</h2><dl><dt>O que é e para que serve</dt><dd>${c.f}</dd><dt>Onde achar no projeto</dt><dd>${c.proj}</dd></dl>${c.g?'<p class="note">Descrição geral: o manual só cita este item na legenda, sem detalhar a função. Confirme no projeto.</p>':""}
 <div class="row"><button id="bt">Detalhes técnicos</button><button id="bl">Lubrificação</button></div><div id="ex"></div>`;
 const ex=$("#ex");
 $("#bt").onclick=()=>ex.innerHTML=`<div class="lub" style="border-color:var(--ink);background:#eef2f4"><b>Dados técnicos</b><br>${c.tec||"O manual não traz dados técnicos específicos para este item."}</div>`;
 $("#bl").onclick=()=>{ex.innerHTML=c.lub?`<div class="lub"><b>Lubrificação</b><br>${c.lub}</div><div class="row"><button id="vf">Ver pontos na figura</button></div>${aviso()}`:`<div class="lub"><b>Lubrificação</b><br>Este componente não tem ponto de lubrificação indicado no manual.</div>`;
  const v=$("#vf");if(v)v.onclick=()=>interno(id,"lub",c.ll)};
}

go(shelf);
</script>
</body>
</html>
