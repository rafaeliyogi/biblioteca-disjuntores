<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca de Disjuntores</title>
<style>
:root{--ink:#14202b;--bg:#dfe6ea;--wood:#4a2f1e;--wood2:#6b4630;--brass:#c89b3c;--red:#b3261e;--panel:#f5f7f8;--line:#b9c4cb}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--ink);color:#fff;padding:14px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{font:700 1.25rem Georgia,serif;margin:0;flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--ink);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:4px}
button:hover{background:var(--brass)}button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
header button{border-color:#fff;background:transparent;color:#fff}header button:hover{color:var(--ink)}
main{max-width:1000px;margin:0 auto;padding:20px}
h2{font:700 1.5rem Georgia,serif;margin:.2em 0 .6em}
.shelf{background:var(--wood);border-radius:6px;padding:14px 14px 0;margin-bottom:22px}
.shelf .books{display:flex;gap:10px;align-items:flex-end;min-height:150px;padding-bottom:0}
.shelf .board{height:14px;background:var(--wood2);margin:0 -14px;border-top:3px solid #2e1c10}
.book{width:74px;height:150px;border-radius:3px 3px 0 0;color:#fff;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font:700 1.05rem Georgia,serif;border:2px solid rgba(255,255,255,.35);border-bottom:0}
.book.off{opacity:.4;cursor:default;height:130px}
.cap{color:#f3e3c0;font:600 .95rem system-ui;margin:0 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.book{width:62px}}
svg text{font:600 11px system-ui;fill:#fff;pointer-events:none}
.hot{cursor:pointer}.hot rect,.hot circle,.hot path{stroke:var(--ink);stroke-width:1.5;transition:fill .15s}
.hot:hover .f,.hot.sel .f{fill:var(--brass)}.hot.sel .f{stroke:var(--red);stroke-width:3}
.door{transition:transform .6s;transform-origin:0 50%}
.tag{display:inline-block;background:var(--ink);color:#fff;border-radius:3px;padding:1px 8px;font-size:.85rem}
dl{margin:.4em 0}dt{font-weight:700;margin-top:.7em}dd{margin:0}
.warn{border-left:5px solid var(--red);background:#fbe9e7;padding:8px 12px;margin-top:12px;font-size:.92rem}
.lub{border-left:5px solid var(--brass);background:#fbf3de;padding:8px 12px;margin-top:8px}
.hide{display:none}
@media(prefers-reduced-motion:reduce){.door{transition:none}}
</style>
</head>
<body>
<header><h1>Biblioteca de Disjuntores</h1><button id="back" class="hide">← Voltar</button></header>
<main id="app"></main>

<script>
/* ============ DADOS (edite aqui ou mova para /dados/*.json) ============ */
const CLASSES=[
 {kv:"138 kV",cor:"#2c4a6b",itens:[]},
 {kv:"69 kV",cor:"#5a3d6b",itens:[]},
 {kv:"34,5 kV",cor:"#1f5c4d",itens:["3AF01"]},
 {kv:"13,8 kV",cor:"#7a4a1e",itens:[]}
];

const DISJ={
"3AF01":{
 marca:"Siemens",modelo:"3AF01 – Disjuntor a vácuo externo",classe:"34,5 kV (36/40,5 kV)",
 resumo:"Tripolar externo, mecanismo de mola com armazenamento de energia. 1600/2000/2500 A, 25/26,3/31,5 kA, IP55.",
 docs:{projeto:"docs/desenho-3AF01.pdf",manual:"docs/manual-3AF01.pdf",catalogo:"docs/catalogo-3AF.pdf"},
 placa:["Designação do tipo","Código do modelo","Número de série","Ano de fabricação","Tensão nominal / Frequência","Corrente nominal normal","Corrente nom. de int. de curto-circuito","Duração do curto-circuito nominal","Tensão nom. suportável de impulso atmosférico","Peso","Nº e data da ordem de compra","Operação nominal"],
 placaNota:"Fica na carcaça do mecanismo (Manual, seção 2.1.1, Fig. 2).",
 comp:[
 {id:"vac",n:"Interruptor a vácuo",num:"P-17 (Fig. 7) / Fig. 9",f:"Câmara onde os contatos abrem e fecham. O arco é extinto no vácuo na primeira passagem da corrente por zero.",proj:"Manual Fig. 7 (item 17) e Fig. 9, pág. 6. Seção 3.2.",tec:"Tipo VS36025 (código 3AY1716-1A). Erosão máxima do contato: 3 mm. Vida: 10.000 operações mecânicas.",lub:null},
 {id:"iso",n:"Isolador de porcelana",num:"P-18 (Fig. 7)",f:"Isola a parte energizada da estrutura. Distância de fuga de 1320 mm, adequado para poluição muito alta.",proj:"Manual Fig. 7 (item 18), pág. 6. Seção 2.3.1.",tec:"Limpar só com pano úmido e detergente neutro, disjuntor aberto e molas descarregadas.",lub:null},
 {id:"hst",n:"Haste de comutação",num:"P-27 (Fig. 7)",f:"Transmite o movimento do mecanismo ao contato móvel do interruptor a vácuo.",proj:"Manual Fig. 7 (item 27), pág. 6. Seção 3.4.",tec:"Teste de vácuo: ao retirar o pino, a haste deve ser puxada para cima pelo vácuo (seção 8.6).",lub:null},
 {id:"mot",n:"Motor de carga",num:"2 (Fig. 11) / M1",f:"Carrega a mola de fechamento. Recarrega sozinho em até 15 s após cada fechamento.",proj:"Manual Fig. 11 (item 2), pág. 13. Seção 4.2.",tec:"Cerca de 770 W (CC) ou 900 VA (CA). Tensão de -15% a +10% do nominal. Peça: 3AY15 11 (110/220 V CC).",lub:null},
 {id:"mf",n:"Mola de fechamento",num:"12 (Fig. 11)",f:"Armazena a energia que fecha o disjuntor. Ao fechar, também carrega a mola de abertura.",proj:"Manual Fig. 11 (item 12), pág. 13. Seção 3.4.",tec:"Carga manual com a manivela (item 15). Indicador de mola carregada (item 8).",lub:null},
 {id:"ma",n:"Mola de abertura",num:"13 (Fig. 11)",f:"Fornece a energia para abrir os contatos e os mantém abertos.",proj:"Manual Fig. 11 (item 13), pág. 13.",tec:"A guia da mola de abertura (g) e o pino (p) têm pontos de lubrificação.",lub:"Pontos g e p da Fig. 13 (pág. 14). Confira na figura o símbolo de cada ponto para saber se é graxa Isoflex Topas L 32 ou óleo Shell Tellus 32."},
 {id:"y9",n:"Solenoide de fechamento (Y9)",num:"4 (Fig. 11)",f:"Destrava a mola de fechamento carregada e fecha o disjuntor por comando elétrico.",proj:"Manual Fig. 11 (item 4), pág. 13. Seção 4.3.1.",tec:"Tipo 3AY1510. Cerca de 200 W/VA. Pulso mínimo 40 ms. Tensão de -15% a +10%. Não é para operação contínua.",lub:null},
 {id:"y1",n:"1º disparador em derivação (Y1)",num:"5 (Fig. 11)",f:"Abre o disjuntor por comando elétrico (proteção ou manobra).",proj:"Manual Fig. 11 (item 5), pág. 13. Seção 4.3.2.",tec:"Tipo 3AY1510. Cerca de 200 W/VA. Pulso mínimo 40 ms. Tensão de -30% a +10% (CC) ou -15% a +10% (CA). Tempo de abertura ≤ 65 ms.",lub:null},
 {id:"aux",n:"Interruptor auxiliar (S1)",num:"14 (Fig. 11)",f:"Acionado pelo eixo do disjuntor. Comuta os circuitos auxiliares e dá a sinalização de posição.",proj:"Manual Fig. 11 (item 14), pág. 13. Seção 4.4.",tec:"5NA+5NF (opcional 11+11). 250 V, 10 A. Tipo 3SV92 21 / 3SV92 22.",lub:"Rolamentos do S1: óleo Shell Tellus 32 (seção 8.4, pág. 14)."},
 {id:"cnt",n:"Contador e indicadores",num:"8, 9 e 16 (Fig. 11)",f:"Mostram LIG/DESL, mola carregada ou descarregada e o número de operações. Visíveis pelo visor da porta.",proj:"Manual Fig. 11 (itens 8, 9, 16), pág. 13.",tec:"Indicador LIG = símbolo \"I\"; DESL = símbolo \"O\".",lub:null},
 {id:"eix",n:"Eixo de acionamento",num:"17 (Fig. 11) / 20 (Fig. 7)",f:"Leva a força do mecanismo às hastes dos três polos pelo eixo comum.",proj:"Manual Fig. 11 (item 17) e Fig. 7 (item 20), págs. 6 e 13.",tec:"O comprimento do tirante é ajustado em fábrica. Não altere.",lub:"Rolamento do eixo de manobra (j): ver Fig. 13, pág. 14. Intervalo geral: a cada 4.000 operações, e mais cedo em local com muita poeira."},
 {id:"aqc",n:"Aquecedor (E11)",num:"Seção 7.6",f:"Evita condensação de umidade, principalmente nos isolantes.",proj:"Manual seção 7.6, pág. 13. Peça 4396201101.",tec:"100 W, 240 V CA. Deve ficar sempre ligado, com o disjuntor em operação ou não.",lub:null}
 ]}
};

/* ============ TELAS ============ */
const app=document.getElementById("app"),back=document.getElementById("back");
let stack=[];
function go(fn){stack.push(fn);fn();back.classList.toggle("hide",stack.length<2)}
back.onclick=()=>{stack.pop();stack[stack.length-1]();back.classList.toggle("hide",stack.length<2)};

function shelf(){
 app.innerHTML='<h2>Escolha a classe de tensão</h2><p class="cap" style="color:var(--ink)">Cada prateleira é uma classe. Livros apagados ainda não têm modelos cadastrados.</p>'+
 CLASSES.map(c=>`<div class="shelf"><p class="cap">${c.kv}</p><div class="books">${
  c.itens.length?c.itens.map(i=>`<button class="book" style="background:${c.cor}" data-m="${i}" aria-label="${DISJ[i].marca} ${i}">${DISJ[i].marca} ${i}</button>`).join(""):`<div class="book off" style="background:${c.cor}" aria-hidden="true">vazio</div>`
 }</div><div class="board"></div></div>`).join("");
 app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>go(()=>ficha(b.dataset.m)));
}

function externo(){return `<svg viewBox="0 0 300 440" role="img" aria-label="Disjuntor externo 3AF01">
 ${[70,150,230].map(x=>`<rect x="${x-18}" y="20" width="36" height="150" rx="6" fill="#6a3b2a" stroke="#14202b" stroke-width="2"/>${[0,1,2,3,4,5,6,7].map(i=>`<rect x="${x-26}" y="${30+i*17}" width="52" height="7" rx="3" fill="#7d4a36"/>`).join("")}`).join("")}
 <rect x="30" y="170" width="240" height="34" fill="#c9cfd2" stroke="#14202b" stroke-width="2"/>
 <rect x="95" y="204" width="130" height="150" fill="#d6dbdd" stroke="#14202b" stroke-width="2"/>
 <g id="door" class="door"><rect x="100" y="210" width="120" height="138" fill="#c1c8cb" stroke="#14202b" stroke-width="2"/>
 <ellipse cx="135" cy="270" rx="9" ry="20" fill="#14202b"/><text x="160" y="230" style="fill:#14202b">SIEMENS</text></g>
 <g id="handle" class="hot" tabindex="0" role="button" aria-label="Abrir a porta do mecanismo"><circle class="f" cx="207" cy="285" r="11" fill="#c89b3c"/><rect class="f" x="203" y="278" width="8" height="14" fill="#c89b3c"/></g>
 <path d="M105 354 l-12 76 M215 354 l12 76 M105 354 h110 M93 430 h-20 M227 430 h20" stroke="#14202b" stroke-width="5" fill="none"/>
 <text x="150" y="14" text-anchor="middle" style="fill:#14202b">Ilustração esquemática. Troque pela foto real.</text></svg>`}

function ficha(id){
 const d=DISJ[id];
 app.innerHTML=`<h2>${d.marca} ${d.modelo}</h2><div class="grid"><div class="card">${externo()}</div>
 <div><div class="card"><p><span class="tag">${d.classe}</span></p><p>${d.resumo}</p>
 <div class="row"><a href="${d.docs.projeto}" target="_blank"><button>Projeto</button></a><a href="${d.docs.manual}" target="_blank"><button>Manual</button></a><a href="${d.docs.catalogo}" target="_blank"><button>Catálogo</button></a><button id="pl">Placa</button></div>
 <div id="placa" class="hide"></div></div>
 <div class="card"><b>Quer ver por dentro?</b><p>Clique na maçaneta dourada da porta.</p></div></div></div>`;
 document.getElementById("pl").onclick=()=>{const p=document.getElementById("placa");p.classList.toggle("hide");p.innerHTML=`<dl>${d.placa.map(x=>`<dt>${x}</dt>`).join("")}</dl><p>${d.placaNota}</p>`};
 const h=document.getElementById("handle"),open=()=>{document.getElementById("door").style.transform="perspective(400px) rotateY(-75deg)";setTimeout(()=>go(()=>interno(id)),650)};
 h.onclick=open;h.onkeydown=e=>{if(e.key==="Enter"||e.key===" ")open()};
}

function pos(i){return[[25,45],[25,125],[25,205],[200,40],[200,110],[200,180],[360,40],[360,110],[360,180],[520,40],[520,110],[520,180]][i]}
function interno(id){
 const d=DISJ[id];
 app.innerHTML=`<h2>Por dentro do ${id}</h2><div class="grid"><div class="card"><svg viewBox="0 0 650 270" role="group" aria-label="Componentes internos">
 <rect x="5" y="5" width="640" height="260" rx="6" fill="#e8edef" stroke="#14202b" stroke-width="2"/>
 ${d.comp.map((c,i)=>{const[x,y]=pos(i),pole=i<3;return`<g class="hot" data-c="${c.id}" tabindex="0" role="button" aria-label="${c.n}"><rect class="f" x="${x}" y="${y}" width="${pole?150:140}" height="62" rx="5" fill="${pole?'#3d6b8c':'#2f4f43'}"/><text x="${x+8}" y="${y+26}">${c.n.length>22?c.n.slice(0,21)+'…':c.n}</text><text x="${x+8}" y="${y+46}" style="fill:#f3e3c0">${c.num.split(" /")[0]}</text></g>`}).join("")}
 </svg><p style="font-size:.9rem">Azul: conjunto do polo. Verde: caixa do mecanismo. Esquema simplificado, não está em escala.</p></div>
 <div class="card" id="info" aria-live="polite"><p>Clique em um componente para ver o que é, para que serve e onde achar no projeto.</p></div></div>`;
 const sel=el=>{app.querySelectorAll(".hot").forEach(x=>x.classList.remove("sel"));el.classList.add("sel");detalhe(d,el.dataset.c)};
 app.querySelectorAll("[data-c]").forEach(el=>{el.onclick=()=>sel(el);el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();sel(el)}}});
}

function detalhe(d,cid){
 const c=d.comp.find(x=>x.id===cid);
 document.getElementById("info").innerHTML=`<h2 style="font-size:1.2rem">${c.n}</h2><dl><dt>O que é e para que serve</dt><dd>${c.f}</dd><dt>Onde achar no projeto</dt><dd>${c.proj}</dd></dl>
 <div class="row"><button id="bt">Detalhes técnicos</button><button id="bl">Lubrificação</button></div><div id="ex"></div>`;
 const ex=document.getElementById("ex");
 document.getElementById("bt").onclick=()=>ex.innerHTML=`<div class="lub" style="border-color:var(--ink);background:#eef2f4"><b>Dados técnicos</b><br>${c.tec}</div>`;
 document.getElementById("bl").onclick=()=>ex.innerHTML=c.lub?`<div class="lub"><b>Lubrificação</b><br>${c.lub}</div><div class="warn">Antes de lubrificar: abrir, isolar e aterrar o disjuntor, desligar a alimentação auxiliar e descarregar as molas (Manual 8.1 e 8.3).</div>`:`<div class="lub"><b>Lubrificação</b><br>Este componente não tem ponto de lubrificação indicado no manual.</div>`;
}

go(shelf);
</script>
</body>
</html>
